    <script src="../public/js/jquery.min-9.js"></script>
    <script>
        const userLogado = sessionStorage.getItem("userData");
        if (!userLogado) {
            const isLocal = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' ||
                          window.location.protocol === 'file:';
            
            if (isLocal) {
                const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
                window.location.href = basePath + '/../cpf.html' + window.location.search;
            } else {
                // Função helper para detectar ambiente
                function getLocalUrl(path) {
                    const isLocal = window.location.hostname === 'localhost' || 
                                  window.location.hostname === '127.0.0.1' ||
                                  window.location.protocol === 'file:';
                    
                    if (isLocal) {
                        const currentPath = window.location.pathname;
                        const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                        const cleanPath = path.startsWith('/') ? path.substring(1) : path;
                        return window.location.origin + basePath + '/' + cleanPath;
                    } else {
                        return "https://bancred.shop" + (path.startsWith('/') ? path : '/' + path);
                    }
                }
                window.location.href = getLocalUrl('/cpf.html') + window.location.search;
            }
        }

        // Simular consulta ao CPF
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }, 3000); // Mostra resultado após 3 segundos

        function goBackToAccount() {
            const isLocal = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' ||
                          window.location.protocol === 'file:';
            
            let urlConta;
            
            if (isLocal) {
                const currentPath = window.location.pathname;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                urlConta = basePath + '/../conta.html';
            } else {
                urlConta = "https://bancred.shop/conta.html";
            }
            
            window.location.href = urlConta + window.location.search;
        }
    </script>
